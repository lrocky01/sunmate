name: Build SunMate iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    name: Build SunMate iOS IPA (No Code Sign)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Configure Flutter & Precache iOS Engine
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter --version
          xcodebuild -version

      - name: 5. Generate Flutter Config & Install CocoaPods
        run: |
          cd sunmate_app
          flutter pub get

          # 兼容 Xcode 15.4 / Swift 编译器：清理 Pigeon 生成代码中的末尾逗号语法冲突
          find "$HOME/.pub-cache" -name "messages.g.swift" -exec sed -i '' -e 's/,[[:space:]]*)$/)/g' {} + || true

          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          echo "FLUTTER_DIR is $FLUTTER_DIR"

          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          BUILD_NUM="${{ github.run_number }}"
          echo "Building SunMate version: $VERSION_NAME (Build $BUILD_NUM)"

          cat << EOF > ios/Flutter/Generated.xcconfig
          FLUTTER_ROOT=$FLUTTER_DIR
          FLUTTER_APPLICATION_PATH=$PWD
          COCOAPODS_PARALLEL_CODE_SIGN=true
          FLUTTER_TARGET=lib/main.dart
          FLUTTER_BUILD_DIR=build
          FLUTTER_BUILD_NAME=$VERSION_NAME
          FLUTTER_BUILD_NUMBER=$BUILD_NUM
          DART_OBFUSCATION=false
          TRACK_WIDGET_CREATION=true
          TREE_SHAKE_ICONS=false
          PACKAGE_CONFIG=.dart_tool/package_config.json
          EOF

          cat << EOF > ios/Flutter/flutter_export_environment.sh
          #!/bin/sh
          export "FLUTTER_ROOT=$FLUTTER_DIR"
          export "FLUTTER_APPLICATION_PATH=$PWD"
          export "COCOAPODS_PARALLEL_CODE_SIGN=true"
          export "FLUTTER_TARGET=lib/main.dart"
          export "FLUTTER_BUILD_DIR=build"
          export "FLUTTER_BUILD_NAME=$VERSION_NAME"
          export "FLUTTER_BUILD_NUMBER=$BUILD_NUM"
          export "DART_OBFUSCATION=false"
          export "TRACK_WIDGET_CREATION=true"
          export "TREE_SHAKE_ICONS=false"
          export "PACKAGE_CONFIG=.dart_tool/package_config.json"
          EOF
          chmod +x ios/Flutter/flutter_export_environment.sh

          cd ios
          pod install --repo-update || pod install
          cd ..

      - name: 6. Build iOS Runner (Release Mode, No Code Sign via xcodebuild)
        run: |
          cd sunmate_app/ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath ../build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build
          cd ../..

      - name: 7. Package Runner.app into SunMate.ipa with Full Icons
        run: |
          mkdir -p build_output/Payload
          APP_DIR=$(find sunmate_app/build -name "Runner.app" -type d | head -n 1)
          echo "Found Runner.app at: $APP_DIR"
          cp -r "$APP_DIR" build_output/Payload/

          # 彻底解决爱思助手/自签名工具找不到桌面图标问题：
          # 1. 复制全套标准 png 图标至 Runner.app 根目录
          cp sunmate_app/ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png build_output/Payload/Runner.app/
          cp build_output/Payload/Runner.app/Icon-App-60x60@2x.png build_output/Payload/Runner.app/AppIcon60x60@2x.png || true
          cp build_output/Payload/Runner.app/Icon-App-60x60@3x.png build_output/Payload/Runner.app/AppIcon60x60@3x.png || true
          cp build_output/Payload/Runner.app/Icon-App-60x60@2x.png build_output/Payload/Runner.app/Icon@2x.png || true
          cp build_output/Payload/Runner.app/Icon-App-60x60@2x.png build_output/Payload/Runner.app/Icon.png || true
          cp build_output/Payload/Runner.app/Icon-App-60x60@2x.png build_output/Payload/Runner.app/AppIcon.png || true

          # 2. 注入 CFBundleIcons 到 Info.plist，确保 iOS SpringBoard 100% 正确加载图标
          python3 -c "
          import plistlib
          plist_path = 'build_output/Payload/Runner.app/Info.plist'
          try:
              with open(plist_path, 'rb') as f:
                  pl = plistlib.load(f)
              pl['CFBundleIcons'] = {
                  'CFBundlePrimaryIcon': {
                      'CFBundleIconFiles': ['AppIcon60x60', 'Icon-App-60x60', 'Icon'],
                      'CFBundleIconName': 'AppIcon'
                  }
              }
              pl['CFBundleIcons~ipad'] = {
                  'CFBundlePrimaryIcon': {
                      'CFBundleIconFiles': ['AppIcon60x60', 'AppIcon76x76', 'Icon-App-60x60', 'Icon'],
                      'CFBundleIconName': 'AppIcon'
                  }
              }
              with open(plist_path, 'wb') as f:
                  plistlib.dump(pl, f)
              print('Successfully injected CFBundleIcons into Info.plist')
          except Exception as e:
              print(f'Warning: Plist injection note: {e}')
          "

          cd build_output
          zip -r -q ../SunMate.ipa Payload
          cd ..
          ls -lh SunMate.ipa

      - name: 8. Upload SunMate.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunMate-iOS-IPA
          path: SunMate.ipa
          retention-days: 14

      - name: 9. Create Release and Attach IPA (If Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SunMate.ipa
          body: |
            ## ☀️ SunMate（阳光智伴）iOS 测试版发布
            
            ### 安装与测试指引（使用爱思助手）：
            1. 在电脑上打开 **爱思助手 (i4Tools)**；
            2. 使用数据线将 iPhone 连接至电脑，并信任电脑；
            3. 在爱思助手中进入 **【工具箱】 -> 【IPA 签名】**；
            4. 添加下载的 `SunMate.ipa`，添加您的个人 Apple ID 进行自签名；
            5. 签名成功后点击 **【安装】** 即可推送到手机；
            6. 首次在手机打开时，前往 iPhone【设置】->【通用】->【VPN 与设备管理】信任开发者证书即可启动！
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
