name: Build SunMate iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    name: Build SunMate iOS IPA (No Code Sign)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Verify Flutter & Environment
        run: |
          flutter --version
          xcodebuild -version

      - name: 5. Install Flutter Dependencies
        run: |
          cd sunmate_app
          flutter pub get

      - name: 6. Build iOS Runner (Release Mode, No Code Sign)
        run: |
          cd sunmate_app
          flutter build ios --release --no-codesign

      - name: 7. Package Runner.app into SunMate.ipa
        run: |
          mkdir -p build_output/Payload
          cp -r sunmate_app/build/ios/iphoneos/Runner.app build_output/Payload/
          cd build_output
          zip -r -q ../SunMate.ipa Payload
          cd ..
          ls -lh SunMate.ipa

      - name: 8. Upload SunMate.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunMate-iOS-IPA
          path: SunMate.ipa
          retention-days: 14

      - name: 9. Create Release and Attach IPA (If Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SunMate.ipa
          body: |
            ## ☀️ SunMate（阳光智伴）iOS 测试版发布
            
            ### 安装与测试指引（使用爱思助手）：
            1. 在电脑上打开 **爱思助手 (i4Tools)**；
            2. 使用数据线将 iPhone 连接至电脑，并信任电脑；
            3. 在爱思助手中进入 **【工具箱】 -> 【IPA 签名】**；
            4. 添加下载的 `SunMate.ipa`，添加您的个人 Apple ID 进行自签名；
            5. 签名成功后点击 **【安装】** 即可推送到手机；
            6. 首次在手机打开时，前往 iPhone【设置】->【通用】->【VPN 与设备管理】信任开发者证书即可启动！
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
