name: sunmate_app
description: "SunMate（阳光智伴）- 伴随式第二大脑与成长智能体 (Flutter 跨平台)"
publish_to: "none"
version: 1.0.5+6

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_blue_plus: ^1.34.0
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  shared_preferences_foundation: 2.5.4

flutter:
  uses-material-design: true
